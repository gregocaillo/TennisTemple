<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>The Winning Oracle | Administration</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
    <link rel="manifest" href="site.webmanifest">
    <meta name="theme-color" content="#04030a">

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Poppins', sans-serif; }
        .title-glow {
            background-image: linear-gradient(100deg, #4c1d95 0%, #7c3aed 16%, #c4b5fd 32%, #f3e8ff 44%, #a78bfa 58%, #7c3aed 74%, #4c1d95 100%);
            background-size: 250% auto;
            -webkit-background-clip: text; background-clip: text; color: transparent; -webkit-text-fill-color: transparent;
            animation: title-shine 6s linear infinite;
            filter: drop-shadow(0 0 16px rgba(124,58,237,0.35));
        }
        @keyframes title-shine {
            to { background-position: -250% center; }
        }
        .gold-frame {
            border-color: rgba(234, 179, 8, 0.5);
            box-shadow: inset 0 1px 0 rgba(255,241,191,0.16), inset 0 -1px 1px rgba(0,0,0,0.45), 0 1px 3px rgba(0,0,0,0.35);
        }
        .bg-court {
            background-color: #04030a;
            background-image:
                radial-gradient(circle at 18% 15%, rgba(124, 58, 237, 0.20) 0%, transparent 45%),
                radial-gradient(circle at 82% 10%, rgba(234, 179, 8, 0.10) 0%, transparent 40%),
                radial-gradient(circle at 50% 85%, rgba(79, 70, 229, 0.22) 0%, transparent 50%),
                radial-gradient(circle at 30% 60%, #0f0b21 0%, #03020a 70%);
        }
        .stars-layer {
            position: fixed; inset: 0; pointer-events: none; z-index: 0; opacity: 0.6;
            background-image:
                radial-gradient(1.5px 1.5px at 10% 20%, #fff, transparent),
                radial-gradient(1px 1px at 80% 10%, #fff, transparent),
                radial-gradient(1.5px 1.5px at 60% 40%, #e9d5ff, transparent),
                radial-gradient(1px 1px at 30% 70%, #fff, transparent),
                radial-gradient(1.5px 1.5px at 90% 60%, #fde68a, transparent),
                radial-gradient(1px 1px at 45% 85%, #fff, transparent);
            background-repeat: repeat; background-size: 550px 550px;
            animation: twinkle 6s ease-in-out infinite alternate;
        }
        @keyframes twinkle { 0% { opacity: 0.35; } 50% { opacity: 0.8; } 100% { opacity: 0.45; } }
    </style>
</head>
<body class="bg-court text-slate-100 min-h-screen">
    <div class="stars-layer"></div>
    <div id="toast-container" class="fixed top-6 right-4 z-[100] flex flex-col gap-2 w-72 max-w-[90vw]"></div>

    <div class="relative z-10 max-w-4xl mx-auto px-6 py-12">
        <a href="index.html" class="title-glow flex items-center gap-2 w-fit text-xl sm:text-2xl font-black tracking-tight mb-10">
            THE WINNING <span class="text-yellow-400">ORACLE</span> <span class="text-slate-500 text-sm font-medium ml-2 font-sans">/ Administration</span>
        </a>

        <div id="app">
            <div class="bg-slate-900 border gold-frame rounded-2xl p-5 h-48 animate-pulse"></div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://eldkwsoucmfgvofsvshc.supabase.co';
        const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_yR4T32bvVYiH2CNUzSKiJg_eb-Trm3M';
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

        function showToast(message, type = 'error') {
            const container = document.getElementById('toast-container');
            if (!container) { alert(message); return; }
            const styles = {
                error: 'bg-red-950/95 border-red-800 text-red-200',
                success: 'bg-emerald-950/95 border-emerald-800 text-emerald-200'
            };
            const icons = { error: 'fa-circle-exclamation', success: 'fa-circle-check' };
            const toast = document.createElement('div');
            toast.className = `${styles[type] || styles.error} border rounded-xl px-4 py-3 text-xs shadow-2xl flex items-start gap-2 transition-all duration-300 opacity-0 translate-x-4`;
            toast.innerHTML = `<i class="fa-solid ${icons[type] || icons.error} mt-0.5"></i><span>${message}</span>`;
            container.appendChild(toast);
            requestAnimationFrame(() => toast.classList.remove('opacity-0', 'translate-x-4'));
            setTimeout(() => { toast.classList.add('opacity-0', 'translate-x-4'); setTimeout(() => toast.remove(), 300); }, 4500);
        }

        async function init() {
            const app = document.getElementById('app');
            const { data: { session } } = await supabaseClient.auth.getSession();

            if (!session) {
                renderLogin();
                return;
            }

            // Vérifie que le compte connecté est bien admin (la policy RLS bloquera de toute façon
            // l'accès aux données si ce n'est pas le cas, mais on adapte l'affichage)
            const { data: profil, error: errProfil } = await supabaseClient
                .from('profiles')
                .select('is_admin')
                .eq('id', session.user.id)
                .single();

            if (errProfil || !profil || !profil.is_admin) {
                app.innerHTML = `
                    <div class="bg-slate-900 border border-red-900/50 rounded-2xl p-8 text-center">
                        <p class="text-red-400 text-sm font-bold mb-2">Accès refusé</p>
                        <p class="text-slate-500 text-xs">Ce compte n'a pas les droits administrateur.</p>
                        <button onclick="logout()" class="mt-4 text-xs text-slate-300 hover:underline">Se déconnecter</button>
                    </div>`;
                return;
            }

            document.getElementById('app').innerHTML = `
                <div class="flex justify-between items-center mb-6">
                    <p class="text-slate-400 text-xs">Espace administrateur</p>
                    <button onclick="logout()" class="text-xs text-slate-500 hover:text-yellow-300">Se déconnecter</button>
                </div>

                <h3 class="text-sm font-bold mb-3 text-slate-300"><i class="fa-solid fa-flag-checkered mr-2 text-yellow-400"></i>Paris en cours à clôturer</h3>
                <div id="app-clotures" class="mb-10">
                    <div class="bg-slate-900 border gold-frame rounded-xl p-4 h-12 animate-pulse"></div>
                </div>

                <h3 class="text-sm font-bold mb-3 text-slate-300"><i class="fa-solid fa-users mr-2 text-yellow-400"></i>Abonnés</h3>
                <div id="app-abonnes">
                    <div class="bg-slate-900 border gold-frame rounded-xl p-4 h-12 animate-pulse"></div>
                </div>`;

            renderAdmin();
            renderClotures();
        }

        function renderLogin() {
            document.getElementById('app').innerHTML = `
                <div class="bg-slate-900 border gold-frame rounded-2xl p-8 max-w-sm">
                    <h4 class="text-sm font-bold mb-4">Connexion administrateur</h4>
                    <input id="email" type="email" placeholder="email" class="w-full mb-2 bg-black border gold-frame text-xs p-2 rounded text-white" onkeydown="if(event.key==='Enter') login()">
                    <input id="pass" type="password" placeholder="mot de passe" class="w-full mb-2 bg-black border gold-frame text-xs p-2 rounded text-white" onkeydown="if(event.key==='Enter') login()">
                    <button onclick="login()" class="bg-gradient-to-r from-violet-700 via-fuchsia-500 to-amber-400 hover:brightness-110 text-white text-xs px-4 py-2 rounded font-bold w-full mt-2">Se connecter</button>
                    <button onclick="demanderReinitialisation()" class="text-slate-500 text-[11px] mt-2 hover:underline w-full bg-transparent">Mot de passe oublié ?</button>
                    <p id="login-error" class="text-red-400 text-xs mt-3 hidden">Identifiants incorrects.</p>
                </div>`;
        }

        async function login() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('pass').value;
            const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
            if (error) {
                document.getElementById('login-error').classList.remove('hidden');
                return;
            }
            init();
        }

        async function demanderReinitialisation() {
            const email = document.getElementById('email')?.value;
            if (!email) {
                showToast("Renseignez d'abord votre email ci-dessus.");
                return;
            }
            const redirectUrl = new URL('reset-password.html', window.location.href).href;
            const { error } = await supabaseClient.auth.resetPasswordForEmail(email, { redirectTo: redirectUrl });
            if (error) {
                showToast("Erreur : " + error.message);
                return;
            }
            showToast("Si ce compte existe, un email de réinitialisation vient d'être envoyé.", 'success');
        }

        async function logout() {
            try { await supabaseClient.auth.signOut(); } catch (e) { /* on redirige quoi qu'il arrive */ }
            window.location.href = 'index.html';
        }

        async function renderAdmin() {
            const app = document.getElementById('app-abonnes');
            app.innerHTML = `
                <div class="space-y-2">
                    <div class="bg-slate-900 border gold-frame rounded-xl p-4 h-12 animate-pulse"></div>
                    <div class="bg-slate-900 border gold-frame rounded-xl p-4 h-12 animate-pulse"></div>
                    <div class="bg-slate-900 border gold-frame rounded-xl p-4 h-12 animate-pulse"></div>
                </div>`;

            const { data, error } = await supabaseClient
                .from('profiles')
                .select('*')
                .order('email', { ascending: true });

            if (error) {
                app.innerHTML = `<p class="text-red-400 text-xs">Erreur de chargement : ${error.message}</p>`;
                return;
            }

            const rows = data.map(p => `
                <tr class="border-b border-slate-700">
                    <td class="px-4 py-3 text-xs text-white">${p.email || '—'}</td>
                    <td class="px-4 py-3 text-xs text-center">
                        <span class="px-2 py-1 rounded-full text-[10px] font-bold ${p.is_premium ? 'bg-amber-500/20 text-amber-300' : 'bg-slate-700/50 text-slate-400'}">
                            ${p.is_premium ? 'PREMIUM' : 'GRATUIT'}
                        </span>
                    </td>
                    <td class="px-4 py-3 text-xs text-center text-slate-400">${p.is_admin ? '✓' : ''}</td>
                    <td class="px-4 py-3 text-center">
                        <button onclick="togglePremium('${p.id}', ${!p.is_premium})"
                                class="text-xs px-3 py-1.5 rounded-lg font-bold transition ${p.is_premium ? 'bg-red-900/50 hover:bg-red-900 text-red-300' : 'bg-gradient-to-r from-violet-700 via-fuchsia-500 to-amber-400 hover:brightness-110 text-white'}">
                            ${p.is_premium ? 'Désactiver' : 'Activer'}
                        </button>
                    </td>
                </tr>`).join('');

            const cartes = data.map(p => `
                <div class="bg-slate-900 border gold-frame rounded-2xl p-4">
                    <div class="flex justify-between items-start gap-2 mb-3">
                        <p class="text-xs text-white break-all">${p.email || '—'}</p>
                        <span class="shrink-0 px-2 py-1 rounded-full text-[10px] font-bold ${p.is_premium ? 'bg-amber-500/20 text-amber-300' : 'bg-slate-700/50 text-slate-400'}">
                            ${p.is_premium ? 'PREMIUM' : 'GRATUIT'}
                        </span>
                    </div>
                    <div class="flex justify-between items-center">
                        <span class="text-[10px] text-slate-500">${p.is_admin ? '✓ Admin' : ''}</span>
                        <button onclick="togglePremium('${p.id}', ${!p.is_premium})"
                                class="text-xs px-3 py-1.5 rounded-lg font-bold transition ${p.is_premium ? 'bg-red-900/50 hover:bg-red-900 text-red-300' : 'bg-gradient-to-r from-violet-700 via-fuchsia-500 to-amber-400 hover:brightness-110 text-white'}">
                            ${p.is_premium ? 'Désactiver' : 'Activer'}
                        </button>
                    </div>
                </div>`).join('');

            app.innerHTML = `
                <p class="text-slate-500 text-xs mb-3">${data.length} compte(s) enregistré(s)</p>

                <div class="hidden md:block bg-slate-900 border gold-frame rounded-2xl overflow-hidden">
                    <table class="w-full">
                        <thead class="bg-slate-950">
                            <tr>
                                <th class="px-4 py-3 text-left text-[10px] uppercase text-slate-500">Email</th>
                                <th class="px-4 py-3 text-center text-[10px] uppercase text-slate-500">Statut</th>
                                <th class="px-4 py-3 text-center text-[10px] uppercase text-slate-500">Admin</th>
                                <th class="px-4 py-3 text-center text-[10px] uppercase text-slate-500">Action</th>
                            </tr>
                        </thead>
                        <tbody>${rows}</tbody>
                    </table>
                </div>

                <div class="md:hidden space-y-3">${cartes}</div>`;
        }

        async function renderClotures() {
            const app = document.getElementById('app-clotures');
            app.innerHTML = `<div class="bg-slate-900 border gold-frame rounded-xl p-4 h-12 animate-pulse"></div>`;

            const { data, error } = await supabaseClient
                .from('pronos_premium')
                .select('*')
                .order('created_at', { ascending: false });

            if (error) {
                app.innerHTML = `<p class="text-red-400 text-xs">Erreur de chargement : ${error.message}</p>`;
                return;
            }

            if (!data || data.length === 0) {
                app.innerHTML = `<p class="text-slate-500 text-xs">Aucun pari en cours pour le moment.</p>`;
                return;
            }

            const cartes = data.map(p => `
                <div class="bg-slate-900 border gold-frame rounded-2xl p-4">
                    <div class="flex justify-between items-start mb-3">
                        <div>
                            <span class="text-violet-300 text-[10px] font-bold uppercase">${p.tournoi}</span>
                            <h4 class="text-sm font-bold">${p.match_intitule}</h4>
                            <p class="text-xs text-slate-400 mt-1">${p.pari} @ ${Number(p.cote).toFixed(2)} — mise ${Number(p.mise).toFixed(2)} €</p>
                        </div>
                    </div>
                    <div class="flex gap-2">
                        <button onclick="cloturePari(${p.id}, ${p.paris_id}, 'Gagné', ${p.cote}, ${p.mise})" class="flex-1 text-xs px-3 py-2 rounded-lg font-bold bg-emerald-600 hover:bg-emerald-500 text-slate-950">Gagné</button>
                        <button onclick="cloturePari(${p.id}, ${p.paris_id}, 'Perdu', ${p.cote}, ${p.mise})" class="flex-1 text-xs px-3 py-2 rounded-lg font-bold bg-red-900/60 hover:bg-red-900 text-red-200">Perdu</button>
                        <button onclick="cloturePari(${p.id}, ${p.paris_id}, 'Annulé', ${p.cote}, ${p.mise})" class="flex-1 text-xs px-3 py-2 rounded-lg font-bold bg-slate-700 hover:bg-slate-600 text-slate-200">Annulé</button>
                    </div>
                </div>`).join('');

            app.innerHTML = `<div class="grid grid-cols-1 md:grid-cols-2 gap-4">${cartes}</div>`;
        }

        async function cloturePari(pronosId, parisId, statut, cote, mise) {
            let gainNet;
            if (statut === 'Gagné') gainNet = Math.round((mise * cote - mise) * 100) / 100;
            else if (statut === 'Perdu') gainNet = -mise;
            else gainNet = 0;

            const { error: errInsert } = await supabaseClient
                .from('resultats_clotures')
                .insert({ paris_id: parisId, statut, gain_net: gainNet });

            if (errInsert) {
                showToast("Erreur lors de l'enregistrement de la clôture : " + errInsert.message);
                return;
            }

            const { error: errDelete } = await supabaseClient
                .from('pronos_premium')
                .delete()
                .eq('id', pronosId);

            if (errDelete) {
                showToast("Clôture enregistrée, mais le retrait de la carte a échoué : " + errDelete.message);
            } else {
                showToast(`Pari clôturé : ${statut} (${gainNet >= 0 ? '+' : ''}${gainNet.toFixed(2)} €)`, 'success');
            }

            renderClotures();
        }

        async function togglePremium(userId, nouvelleValeur) {
            const { error } = await supabaseClient
                .from('profiles')
                .update({ is_premium: nouvelleValeur })
                .eq('id', userId);

            if (error) {
                showToast("Erreur lors de la mise à jour : " + error.message);
                return;
            }
            showToast(nouvelleValeur ? "Accès premium activé." : "Accès premium désactivé.", 'success');
            renderAdmin();
        }

        init();
    </script>
</body>
</html>
