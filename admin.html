<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>TennisTemple | Administration</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Poppins', sans-serif; }
        .bg-court { background: radial-gradient(circle at 30% 20%, #0f172a 0%, #020617 70%); }
    </style>
</head>
<body class="bg-court text-slate-100 min-h-screen">
    <div id="toast-container" class="fixed top-6 right-4 z-[100] flex flex-col gap-2 w-72 max-w-[90vw]"></div>

    <div class="max-w-4xl mx-auto px-6 py-12">
        <a href="index.html" class="block text-2xl font-black tracking-tighter bg-gradient-to-r from-emerald-400 via-teal-300 to-yellow-300 bg-clip-text text-transparent mb-10 w-fit">
            TENNIS<span class="text-yellow-400">TEMPLE</span> <span class="text-slate-500 text-sm font-medium ml-2">/ Administration</span>
        </a>

        <div id="app">
            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 h-48 animate-pulse"></div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://eldkwsoucmfgvofsvshc.supabase.co';
        const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_yR4T32bvVYiH2CNUzSKiJg_eb-Trm3M';
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

        function showToast(message, type = 'error') {
            const container = document.getElementById('toast-container');
            if (!container) { alert(message); return; }
            const styles = {
                error: 'bg-red-950/95 border-red-800 text-red-200',
                success: 'bg-emerald-950/95 border-emerald-800 text-emerald-200'
            };
            const icons = { error: 'fa-circle-exclamation', success: 'fa-circle-check' };
            const toast = document.createElement('div');
            toast.className = `${styles[type] || styles.error} border rounded-xl px-4 py-3 text-xs shadow-2xl flex items-start gap-2 transition-all duration-300 opacity-0 translate-x-4`;
            toast.innerHTML = `<i class="fa-solid ${icons[type] || icons.error} mt-0.5"></i><span>${message}</span>`;
            container.appendChild(toast);
            requestAnimationFrame(() => toast.classList.remove('opacity-0', 'translate-x-4'));
            setTimeout(() => { toast.classList.add('opacity-0', 'translate-x-4'); setTimeout(() => toast.remove(), 300); }, 4500);
        }

        async function init() {
            const app = document.getElementById('app');
            const { data: { session } } = await supabaseClient.auth.getSession();

            if (!session) {
                renderLogin();
                return;
            }

            // Vérifie que le compte connecté est bien admin (la policy RLS bloquera de toute façon
            // l'accès aux données si ce n'est pas le cas, mais on adapte l'affichage)
            const { data: profil, error: errProfil } = await supabaseClient
                .from('profiles')
                .select('is_admin')
                .eq('id', session.user.id)
                .single();

            if (errProfil || !profil || !profil.is_admin) {
                app.innerHTML = `
                    <div class="bg-slate-900 border border-red-900/50 rounded-2xl p-8 text-center">
                        <p class="text-red-400 text-sm font-bold mb-2">Accès refusé</p>
                        <p class="text-slate-500 text-xs">Ce compte n'a pas les droits administrateur.</p>
                        <button onclick="logout()" class="mt-4 text-xs text-emerald-400 hover:underline">Se déconnecter</button>
                    </div>`;
                return;
            }

            document.getElementById('app').innerHTML = `
                <div class="flex justify-between items-center mb-6">
                    <p class="text-slate-400 text-xs">Espace administrateur</p>
                    <button onclick="logout()" class="text-xs text-slate-500 hover:text-emerald-400">Se déconnecter</button>
                </div>

                <h3 class="text-sm font-bold mb-3 text-slate-300"><i class="fa-solid fa-flag-checkered mr-2 text-emerald-400"></i>Paris en cours à clôturer</h3>
                <div id="app-clotures" class="mb-10">
                    <div class="bg-slate-900 border border-slate-800 rounded-xl p-4 h-12 animate-pulse"></div>
                </div>

                <h3 class="text-sm font-bold mb-3 text-slate-300"><i class="fa-solid fa-users mr-2 text-emerald-400"></i>Abonnés</h3>
                <div id="app-abonnes">
                    <div class="bg-slate-900 border border-slate-800 rounded-xl p-4 h-12 animate-pulse"></div>
                </div>`;

            renderAdmin();
            renderClotures();
        }

        function renderLogin() {
            document.getElementById('app').innerHTML = `
                <div class="bg-slate-900 border border-slate-700 rounded-2xl p-8 max-w-sm">
                    <h4 class="text-sm font-bold mb-4">Connexion administrateur</h4>
                    <input id="email" type="email" placeholder="email" class="w-full mb-2 bg-black border border-slate-700 text-xs p-2 rounded text-white">
                    <input id="pass" type="password" placeholder="mot de passe" class="w-full mb-2 bg-black border border-slate-700 text-xs p-2 rounded text-white">
                    <button onclick="login()" class="bg-emerald-600 text-xs px-4 py-2 rounded font-bold w-full mt-2">Se connecter</button>
                    <p id="login-error" class="text-red-400 text-xs mt-3 hidden">Identifiants incorrects.</p>
                </div>`;
        }

        async function login() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('pass').value;
            const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
            if (error) {
                document.getElementById('login-error').classList.remove('hidden');
                return;
            }
            init();
        }

        async function logout() {
            await supabaseClient.auth.signOut();
            window.location.href = 'index.html';
        }

        async function renderAdmin() {
            const app = document.getElementById('app-abonnes');
            app.innerHTML = `
                <div class="space-y-2">
                    <div class="bg-slate-900 border border-slate-800 rounded-xl p-4 h-12 animate-pulse"></div>
                    <div class="bg-slate-900 border border-slate-800 rounded-xl p-4 h-12 animate-pulse"></div>
                    <div class="bg-slate-900 border border-slate-800 rounded-xl p-4 h-12 animate-pulse"></div>
                </div>`;

            const { data, error } = await supabaseClient
                .from('profiles')
                .select('*')
                .order('email', { ascending: true });

            if (error) {
                app.innerHTML = `<p class="text-red-400 text-xs">Erreur de chargement : ${error.message}</p>`;
                return;
            }

            const rows = data.map(p => `
                <tr class="border-b border-slate-800">
                    <td class="px-4 py-3 text-xs text-white">${p.email || '—'}</td>
                    <td class="px-4 py-3 text-xs text-center">
                        <span class="px-2 py-1 rounded-full text-[10px] font-bold ${p.is_premium ? 'bg-emerald-500/20 text-emerald-400' : 'bg-slate-700/50 text-slate-400'}">
                            ${p.is_premium ? 'PREMIUM' : 'GRATUIT'}
                        </span>
                    </td>
                    <td class="px-4 py-3 text-xs text-center text-slate-400">${p.is_admin ? '✓' : ''}</td>
                    <td class="px-4 py-3 text-center">
                        <button onclick="togglePremium('${p.id}', ${!p.is_premium})"
                                class="text-xs px-3 py-1.5 rounded-lg font-bold transition ${p.is_premium ? 'bg-red-900/50 hover:bg-red-900 text-red-300' : 'bg-emerald-600 hover:bg-emerald-500 text-slate-950'}">
                            ${p.is_premium ? 'Désactiver' : 'Activer'}
                        </button>
                    </td>
                </tr>`).join('');

            const cartes = data.map(p => `
                <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4">
                    <div class="flex justify-between items-start gap-2 mb-3">
                        <p class="text-xs text-white break-all">${p.email || '—'}</p>
                        <span class="shrink-0 px-2 py-1 rounded-full text-[10px] font-bold ${p.is_premium ? 'bg-emerald-500/20 text-emerald-400' : 'bg-slate-700/50 text-slate-400'}">
                            ${p.is_premium ? 'PREMIUM' : 'GRATUIT'}
                        </span>
                    </div>
                    <div class="flex justify-between items-center">
                        <span class="text-[10px] text-slate-500">${p.is_admin ? '✓ Admin' : ''}</span>
                        <button onclick="togglePremium('${p.id}', ${!p.is_premium})"
                                class="text-xs px-3 py-1.5 rounded-lg font-bold transition ${p.is_premium ? 'bg-red-900/50 hover:bg-red-900 text-red-300' : 'bg-emerald-600 hover:bg-emerald-500 text-slate-950'}">
                            ${p.is_premium ? 'Désactiver' : 'Activer'}
                        </button>
                    </div>
                </div>`).join('');

            app.innerHTML = `
                <p class="text-slate-500 text-xs mb-3">${data.length} compte(s) enregistré(s)</p>

                <div class="hidden md:block bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden">
                    <table class="w-full">
                        <thead class="bg-slate-950">
                            <tr>
                                <th class="px-4 py-3 text-left text-[10px] uppercase text-slate-500">Email</th>
                                <th class="px-4 py-3 text-center text-[10px] uppercase text-slate-500">Statut</th>
                                <th class="px-4 py-3 text-center text-[10px] uppercase text-slate-500">Admin</th>
                                <th class="px-4 py-3 text-center text-[10px] uppercase text-slate-500">Action</th>
                            </tr>
                        </thead>
                        <tbody>${rows}</tbody>
                    </table>
                </div>

                <div class="md:hidden space-y-3">${cartes}</div>`;
        }

        async function renderClotures() {
            const app = document.getElementById('app-clotures');
            app.innerHTML = `<div class="bg-slate-900 border border-slate-800 rounded-xl p-4 h-12 animate-pulse"></div>`;

            const { data, error } = await supabaseClient
                .from('pronos_premium')
                .select('*')
                .order('created_at', { ascending: false });

            if (error) {
                app.innerHTML = `<p class="text-red-400 text-xs">Erreur de chargement : ${error.message}</p>`;
                return;
            }

            if (!data || data.length === 0) {
                app.innerHTML = `<p class="text-slate-500 text-xs">Aucun pari en cours pour le moment.</p>`;
                return;
            }

            const cartes = data.map(p => `
                <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4">
                    <div class="flex justify-between items-start mb-3">
                        <div>
                            <span class="text-emerald-400 text-[10px] font-bold uppercase">${p.tournoi}</span>
                            <h4 class="text-sm font-bold">${p.match_intitule}</h4>
                            <p class="text-xs text-slate-400 mt-1">${p.pari} @ ${Number(p.cote).toFixed(2)} — mise ${Number(p.mise).toFixed(2)} €</p>
                        </div>
                    </div>
                    <div class="flex gap-2">
                        <button onclick="cloturePari(${p.id}, ${p.paris_id}, 'Gagné', ${p.cote}, ${p.mise})" class="flex-1 text-xs px-3 py-2 rounded-lg font-bold bg-emerald-600 hover:bg-emerald-500 text-slate-950">Gagné</button>
                        <button onclick="cloturePari(${p.id}, ${p.paris_id}, 'Perdu', ${p.cote}, ${p.mise})" class="flex-1 text-xs px-3 py-2 rounded-lg font-bold bg-red-900/60 hover:bg-red-900 text-red-200">Perdu</button>
                        <button onclick="cloturePari(${p.id}, ${p.paris_id}, 'Annulé', ${p.cote}, ${p.mise})" class="flex-1 text-xs px-3 py-2 rounded-lg font-bold bg-slate-700 hover:bg-slate-600 text-slate-200">Annulé</button>
                    </div>
                </div>`).join('');

            app.innerHTML = `<div class="grid grid-cols-1 md:grid-cols-2 gap-4">${cartes}</div>`;
        }

        async function cloturePari(pronosId, parisId, statut, cote, mise) {
            let gainNet;
            if (statut === 'Gagné') gainNet = Math.round((mise * cote - mise) * 100) / 100;
            else if (statut === 'Perdu') gainNet = -mise;
            else gainNet = 0;

            const { error: errInsert } = await supabaseClient
                .from('resultats_clotures')
                .insert({ paris_id: parisId, statut, gain_net: gainNet });

            if (errInsert) {
                showToast("Erreur lors de l'enregistrement de la clôture : " + errInsert.message);
                return;
            }

            const { error: errDelete } = await supabaseClient
                .from('pronos_premium')
                .delete()
                .eq('id', pronosId);

            if (errDelete) {
                showToast("Clôture enregistrée, mais le retrait de la carte a échoué : " + errDelete.message);
            } else {
                showToast(`Pari clôturé : ${statut} (${gainNet >= 0 ? '+' : ''}${gainNet.toFixed(2)} €)`, 'success');
            }

            renderClotures();
        }

        async function togglePremium(userId, nouvelleValeur) {
            const { error } = await supabaseClient
                .from('profiles')
                .update({ is_premium: nouvelleValeur })
                .eq('id', userId);

            if (error) {
                showToast("Erreur lors de la mise à jour : " + error.message);
                return;
            }
            showToast(nouvelleValeur ? "Accès premium activé." : "Accès premium désactivé.", 'success');
            renderAdmin();
        }

        init();
    </script>
</body>
</html>
