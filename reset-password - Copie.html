<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>The Winning Oracle | Réinitialiser le mot de passe</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Poppins', sans-serif; }
        .bg-court { background: radial-gradient(circle at 30% 20%, #0f172a 0%, #020617 70%); }
    </style>
</head>
<body class="bg-court text-slate-100 min-h-screen flex items-center justify-center px-6">
    <div id="toast-container" class="fixed top-6 right-4 z-[100] flex flex-col gap-2 w-72 max-w-[90vw]"></div>

    <div class="bg-slate-900 border border-slate-700 rounded-2xl p-8 max-w-sm w-full">
        <a href="index.html" class="block text-2xl font-black tracking-tighter bg-gradient-to-r from-emerald-400 via-teal-300 to-yellow-300 bg-clip-text text-transparent mb-6 w-fit">
            THE WINNING<span class="text-yellow-400">ORACLE</span>
        </a>
        <div id="app">
            <div class="bg-slate-800 rounded-xl h-24 animate-pulse"></div>
        </div>
    </div>

    <script>
        const supabaseClient = window.supabase.createClient(
            'https://eldkwsoucmfgvofsvshc.supabase.co',
            'sb_publishable_yR4T32bvVYiH2CNUzSKiJg_eb-Trm3M'
        );

        function showToast(message, type = 'error') {
            const container = document.getElementById('toast-container');
            if (!container) { alert(message); return; }
            const styles = {
                error: 'bg-red-950/95 border-red-800 text-red-200',
                success: 'bg-emerald-950/95 border-emerald-800 text-emerald-200'
            };
            const icons = { error: 'fa-circle-exclamation', success: 'fa-circle-check' };
            const toast = document.createElement('div');
            toast.className = `${styles[type] || styles.error} border rounded-xl px-4 py-3 text-xs shadow-2xl flex items-start gap-2 transition-all duration-300 opacity-0 translate-x-4`;
            toast.innerHTML = `<i class="fa-solid ${icons[type] || icons.error} mt-0.5"></i><span>${message}</span>`;
            container.appendChild(toast);
            requestAnimationFrame(() => toast.classList.remove('opacity-0', 'translate-x-4'));
            setTimeout(() => { toast.classList.add('opacity-0', 'translate-x-4'); setTimeout(() => toast.remove(), 300); }, 4500);
        }

        async function init() {
            const app = document.getElementById('app');
            // Le lien reçu par email contient un jeton de récupération dans l'URL ;
            // supabase-js le détecte automatiquement et ouvre une session temporaire.
            const { data: { session } } = await supabaseClient.auth.getSession();

            if (!session) {
                app.innerHTML = `
                    <p class="text-red-400 text-xs">Lien invalide ou expiré.</p>
                    <a href="index.html" class="block text-emerald-400 text-xs mt-4 hover:underline">Retour à l'accueil</a>`;
                return;
            }

            app.innerHTML = `
                <h4 class="text-sm font-bold mb-4">Choisissez un nouveau mot de passe</h4>
                <input id="new-pass" type="password" placeholder="nouveau mot de passe (6 caractères min.)" class="w-full mb-2 bg-black border border-slate-700 text-xs p-2 rounded text-white" onkeydown="if(event.key==='Enter') validerNouveauMotDePasse()">
                <input id="new-pass-confirm" type="password" placeholder="confirmer le mot de passe" class="w-full mb-2 bg-black border border-slate-700 text-xs p-2 rounded text-white" onkeydown="if(event.key==='Enter') validerNouveauMotDePasse()">
                <button onclick="validerNouveauMotDePasse()" class="bg-emerald-600 text-xs px-4 py-2 rounded font-bold w-full mt-2">Valider</button>`;
        }

        async function validerNouveauMotDePasse() {
            const p1 = document.getElementById('new-pass').value;
            const p2 = document.getElementById('new-pass-confirm').value;

            if (p1.length < 6) { showToast("6 caractères minimum."); return; }
            if (p1 !== p2) { showToast("Les mots de passe ne correspondent pas."); return; }

            const { error } = await supabaseClient.auth.updateUser({ password: p1 });
            if (error) { showToast("Erreur : " + error.message); return; }

            document.getElementById('app').innerHTML = `
                <p class="text-emerald-400 text-xs"><i class="fa-solid fa-circle-check mr-1"></i>Mot de passe mis à jour !</p>
                <a href="index.html" class="block text-emerald-400 text-xs mt-4 hover:underline font-bold">Retour à l'accueil</a>`;
        }

        init();
    </script>
</body>
</html>
